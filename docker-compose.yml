version: '3.8'

services:
  prompt-forge:
    build:
      context: .
      dockerfile: Dockerfile
    image: prompt-forge-saas:latest
    container_name: prompt-forge-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=file:./prisma/prompt_forge.db
    volumes:
      - prompt-forge-data:/app/prisma
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/prompts"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  prompt-forge-data:
